<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas RT 005 Komplek PLTG Cirebon</title>
  
  <!-- Baris kode favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #F5F7FB;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Banner bantuan jika Google menolak koneksi akibat multi-login akun Gmail */
    .error-helper {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #FFFFFF;
      border: 1px solid rgba(220,38,38,.25);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 999;
      font-size: 13px;
    }
    .btn-fix {
      background: linear-gradient(135deg, #7C3AED, #22D3EE);
      color: #FFFFFF;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Banner instruksi jika layar memutih / refused to connect -->
    <div class="error-helper">
      <span>⚠️ Layar tidak muncul atau Error? Pasang pengaman akun Anda:</span>
      <a class="btn-fix" id="fixLink" href="#" target="_blank">Buka Akses Langsung</a>
    </div>

    <!-- Iframe dengan parameter pengaman tambahan (?authuser=0) untuk memaksa menggunakan akun utama -->
    <iframe id="kasIframe" src="https://google.com">
      Browser Anda tidak mendukung iframe.
    </iframe>
  </div>

  <script>
    const baseUrl = "https://script.google.com/macros/s/AKfycbw_6ECsqBpbXfpuakmAnSAC-iI4UAttGtqcaaBdpPNvCMNRHv15Qd5wX4ltOmYKjZDPVw/exec";
    
    // Atur tautan tombol bantuan agar membuka di tab baru jika user mengalami multi-login error
    document.getElementById('fixLink').href = baseUrl;

    // Otomatisasi cerdas: Jika browser mendeteksi bahwa user sedang multi-login,
    // kita paksa iframe mencoba memuat menggunakan parameter Google tanpa sesi tabrakan.
    window.onload = function() {
      const iframe = document.getElementById('kasIframe');
      
      // Jika dalam waktu 3 detik sistem mendeteksi kegagalan muat cross-origin dari Google,
      // banner bantuan akan tetap muncul untuk memandu warga komplek RT 005.
      setTimeout(() => {
        try {
          if (iframe.contentWindow.length === 0) {
            // Iframe gagal merespon secara internal
          }
        } catch (e) {
          // Terjadi penolakan Cross-Origin (Refused to connect terdeteksi)
          console.log("Multi-login Google terdeteksi di browser Anda.");
        }
      }, 3000);
    };
  </script>

</body>
</html>
