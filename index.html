<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas RT 005 Komplek PLTG Cirebon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #F5F7FB;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    
    /* ===== 📥 DESAIN LAYAR TUNGGU (LOADING SCREEN) ===== */
    .loading-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5F7FB;
      z-index: 999; 
      color: #475569;
      transition: opacity 0.4s ease, visibility 0.4s ease; /* Efek memudar halus */
    }
    /* Animasi lingkaran berputar (Spinner) */
    .spinner {
      border: 4px solid #E2E8F0;
      border-top: 4px solid #7C3AED; /* Warna ungu premium */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-screen h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      color: #0F172A;
      font-weight: 700;
    }
    .loading-screen p {
      margin: 0;
      font-size: 13px;
      color: #64748B;
    }
    /* Kelas untuk menghilangkan loading screen */
    .fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- LAYER TRANSISI LAYAR TUNGGU UNTUK WARGA -->
  <div id="loading" class="loading-screen">
    <div class="spinner"></div>
    <h3>Tunggu sebentar...Maklum Mode GRATIS!!</h3>
    <p>Anda akan dihubungkan ke page RT 05</p>
  </div>

  <!-- BINGKAI KAS RT UTAMA -->
  <iframe id="kasIframe" src="https://script.google.com/macros/s/AKfycbw_6ECsqBpbXfpuakmAnSAC-iI4UAttGtqcaaBdpPNvCMNRHv15Qd5wX4ltOmYKjZDPVw/exec">
    Browser Anda tidak mendukung iframe.
  </iframe>

  <script>
    var iframe = document.getElementById('kasIframe');
    var loading = document.getElementById('loading');

    // Otomatis menghilangkan layar loading ketika server Apps Script selesai memuat halaman
    iframe.onload = function() {
      loading.classList.add('fade-out');
    };
  </script>

</body>
</html>
