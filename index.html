<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kas RT 005 Komplek PLTG</title>
  
  <!-- Membaca file favicon.png asli dari repositori GitHub Anda -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- METODE 1: Pengalihan Instan otomatis dengan parameter pemaksa akun utama (?authuser=0) -->
  <meta http-equiv="refresh" content="0;url=https://google.com">
</head>
<body>

  <script>
    // METODE 2: Pengalihan Cadangan JavaScript jika Meta Tag dihambat browser
    // Ditambahkan ?authuser=0 agar Google tidak melempar Anda ke halaman www.google.com akibat masalah multi-login
    window.location.replace("https://google.com");
  </script>

</body>
</html>
