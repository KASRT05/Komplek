<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kas RT 005 Komplek PLTG Cirebon</title>
  
  <!-- Membaca file favicon.png asli dari repositori GitHub Anda -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #F5F7FB;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .wrapper {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
      margin: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Desain Layar Tunggu (Loading Screen) Rekomendasi */
    .loading-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5F7FB;
      z-index: 999; 
      color: #475569;
      transition: opacity 0.4s ease; /* Efek menghilang mulus */
    }
    /* Animasi lingkaran berputar (Spinner) */
    .spinner {
      border: 4px solid #E2E8F0;
      border-top: 4px solid #7C3AED; /* Warna ungu brand KSL */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-screen h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      color: #0F172A;
    }
    .loading-screen p {
      margin: 0;
      font-size: 13px;
      color: #64748B;
    }
  </style>
</head>
<body>

  <!-- 📥 LAYAR TUNGGU (LOADING SCREEN) PILIHAN ANDA -->
  <div id="loading" class="loading-screen">
    <div class="spinner"></div>
    <h3>Tunggu sebentar...</h3>
    <p>Anda akan dihubungkan ke page RT 05</p>
  </div>

  <div class="wrapper">
    <!-- Bingkai untuk mengunci agar URL browser warga tetap pendek -->
    <iframe id="kasIframe" src="https://google.com">
      Browser Anda tidak mendukung iframe.
    </iframe>
  </div>

  <script>
    // OTOMATISASI: Deteksi kapan Google Apps Script selesai dimuat oleh browser
    var iframe = document.getElementById('kasIframe');
    var loading = document.getElementById('loading');

    iframe.onload = function() {
      // Hilangkan layar loading dengan efek memudar (fade out) yang halus
      loading.style.opacity = '0';
      setTimeout(function() {
        loading.style.display = 'none';
      }, 400); // Waktu transisi
    };
  </script>

</body>
</html>
