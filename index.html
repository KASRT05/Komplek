<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kas RT 005 Komplek PLTG Cirebon</title>
  
  <!-- Membaca file favicon.png asli dari repositori GitHub Anda -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #F5F7FB;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #0F172A;
    }

    /* --- Desain Layar Tunggu (Loading) --- */
    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .spinner {
      border: 4px solid #E2E8F0;
      border-top: 4px solid #7C3AED; /* Warna ungu khas KSL */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 { margin: 0 0 6px 0; font-size: 16px; font-weight: 700; }
    p { margin: 0; font-size: 13px; color: #64748B; }

    /* --- Desain Tombol Utama Kreatif --- */
    .btn-container {
      display: none; /* Disembunyikan di awal */
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-portal {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7C3AED, #22D3EE);
      color: #FFFFFF;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: .2px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(124,58,237,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-portal:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(124,58,237,0.35);
    }
    .btn-portal:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- 📥 Bagian 1: Layar Tunggu Animasi -->
  <div id="loadingZone" class="loading-box">
    <div class="spinner"></div>
    <h3>Tunggu sebentar...</h3>
    <p>Anda akan dihubungkan ke page RT 05</p>
  </div>

  <!-- 🚀 Bagian 2: Tombol Akses Portal yang Muncul Setelah Loading -->
  <div id="buttonZone" class="btn-container">
    <div style="font-size: 40px; margin-bottom: 12px;">🏡</div>
    <h3 style="margin-bottom: 4px;">Sistem Kas RT 005 Siap</h3>
    <p style="margin-bottom: 20px; padding: 0 20px;">Silakan klik tombol di bawah untuk masuk ke halaman kas murni tanpa hambatan login.</p>
    
    <!-- Target _top berfungsi menghancurkan iframe dan membuka halaman secara bersih penuh -->
    <a class="btn-portal" href="https://google.com" target="_top">
      Masuk ke Aplikasi Kas RT 05 💰
    </a>
  </div>

  <script>
    // Transisi otomatis setelah 1.8 detik
    setTimeout(function() {
      // Sembunyikan spinner loading
      document.getElementById('loadingZone').style.display = 'none';
      // Munculkan tombol masuk utama yang indah
      document.getElementById('buttonZone').style.display = 'block';
    }, 1800);
  </script>

</body>
</html>
