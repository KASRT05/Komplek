<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas RT 005 Komplek PLTG Cirebon</title>
  
  <!-- Membaca logo favicon.png asli langsung dari repositori GitHub Anda -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #F5F7FB;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #475569;
    }
    /* Animasi lingkaran berputar (Spinner) */
    .spinner {
      border: 4px solid #E2E8F0;
      border-top: 4px solid #7C3AED; /* Warna ungu premium */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 { margin: 0 0 6px 0; font-size: 16px; color: #0F172A; font-weight: 700; }
    p { margin: 0; font-size: 13px; color: #64748B; }
  </style>
</head>
<body>

  <!-- 📥 ANIMASI LAYAR TUNGGU SEBELUM DIALIKHAN SECARA AMAN -->
  <div class="spinner"></div>
  <h3>Sabar yaaa...Maklum Mode Gratis, Lambat dikit</h3>
  <p>Anda akan dihubungkan ke page RT 05</p>

  <script>
    // Link tujuan Google Apps Script murni Anda
    const targetUrl = "https://google.com";

    // Jeda waktu 1.5 detik agar warga melihat animasi loading yang profesional,
    // lalu browser langsung dilempar ke sistem kas secara murni tanpa iframe terlarang Google!
    setTimeout(function() {
      window.location.replace(targetUrl);
    }, 1500);
  </script>

</body>
</html>
